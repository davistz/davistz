name: query

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: query
  cancel-in-progress: false

jobs:
  run:
    if: startsWith(github.event.issue.title, 'query:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: run query
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 game/query.py

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/plays.json
          git diff --cached --quiet || (git commit -m "query: resultado novo" && git pull --rebase && git push)

      - name: reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file game/comment.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
